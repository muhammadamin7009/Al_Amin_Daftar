# /etc/nginx/sites-available/daftar
# Havola: ln -s /etc/nginx/sites-available/daftar /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name DOMEN;

    # Certbot shu yerdan tekshiradi
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name DOMEN;

    ssl_certificate     /etc/letsencrypt/live/DOMEN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMEN/privkey.pem;

    # Telefonda o'rnatiladigan dastur uchun HTTPS shart
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Service worker keshlanmasin, yangilanishi bilan tarqalsin
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
